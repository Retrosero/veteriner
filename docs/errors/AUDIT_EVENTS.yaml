# -----------------------------------------------------------------------------
# SECURITY EVENTS (high-priority alerting)
# -----------------------------------------------------------------------------
security:
  cross_tenant:
    - event: "audit:security.cross_tenant_attempt"
      action: read
      severity: critical
      pii: false
      actor: [system]
      description: "Cross-tenant erişim denemesi (P1 alert)."

  rate_limit:
    - event: "audit:security.rate_limit_exceeded"
      action: read
      severity: warning
      pii: true
      actor: [system]
      description: "Rate limit aşıldı."

  suspicious:
    - event: "audit:security.session_hijack_suspect"
      action: update
      severity: critical
      pii: true
      actor: [system]
      description: "Oturum kaçırma şüphesi (P0 alert)."

# -----------------------------------------------------------------------------
# SCHEMA
# -----------------------------------------------------------------------------
schema:
  event: string  # format: ^audit:[a-z_]+:[a-z_]+$
  action:
    type: enum
    values: [create, read, update, archive, restore, erase,
             export, sign, amend, complete, cancel, reverse,
             transfer, adjust, dispense, admit, discharge,
             invite, assign_role, format_currency, send, receive]
  severity:
    type: enum
    values: [info, warning, error, critical]
  pii: boolean
  actor:
    type: enum
    values: [user, system, integration, job]
    array: true
  description: string

  common_fields:
    - event_id: uuid
    - event_name: string
    - tenant_id: uuid
    - branch_id: uuid_null
    - actor_id: uuid_null
    - actor_type: enum
    - target_type: string
    - target_id: string
    - correlation_id: string
    - ip_address: string_masked
    - user_agent_hash: string
    - country: enum_TR_GB
    - timestamp: timestamptz
