# @file Audit Event Kataloğu.
# @module docs/errors/AUDIT_EVENTS
#
# @description VetNiva'da audit log'a yazılan tüm
# event'lerin makinece okunabilir kataloğu. Her event
# action, severity, PII etiketi ve actor tipini taşır.
# docs:check bu kataloğu koda karşı doğrular.
#
# @author GOAL-004 (FAZ-0) audit + log + hata standardı
# @since 2026-07-30
# @security PII etiketi: events with pii=true mask'lenir.
#   severity=critical olan event'ler anlık alert tetikler.
# =============================================================================

# Audit Event Kataloğu
#
# Format: audit:<entity>:<action>
# CI doğrulama: pnpm docs:check
# Schema: docs/errors/AUDIT_LOG_STANDARD.md

version: "1.0.0"
generated_by: "GOAL-004"
generated_at: "2026-07-30"

# -----------------------------------------------------------------------------
# COMMON METADATA
# -----------------------------------------------------------------------------
metadata:
  description: >
    Tüm audit event'ler için ortak meta. Her event
    aşağıdaki alanları zorunlu taşır: tenant_id,
    actor_id, correlation_id, country, severity,
    timestamp.
  retention_years: 7
  append_only: true
  pii_masking_required: true

