page_id: web.app.locale.superadmin.retention
route: "/[locale]/superadmin/retention"
module: superadmin
title_key: retention.title
purpose:
  tr-TR: "Tüm tenant'ların log retention policy'lerini yöneten ve sweep tetikleyen SUPERADMIN paneli. Policies, Sweeps, Effective sekmeleri ile tenant × logType × severity retention zincirini gösterir."
  en-GB: "SUPERADMIN panel that manages log retention policies for all tenants and triggers sweeps. Shows the tenant × logType × severity chain via the Policies, Sweeps and Effective tabs."
allowed_roles:
  - SUPERADMIN
required_permissions:
  - "audit:log:read"
prerequisites:
  - "Kullanıcı SUPERADMIN rolüne sahip olmalı (GOAL-016)."
  - "Actor context'inde tenantId yok (cross-tenant görünüm)."
fields:
  - key: filters.tenantId
    label_key: retention.filters.tenant
    description:
      tr-TR: "null = global override; uuid = tenant-specific override."
      en-GB: "null = global override; uuid = tenant-specific override."
    type: string
    required: false
  - key: filters.logType
    label_key: retention.filters.logType
    description:
      tr-TR: "audit_log | error_event | security_event | job_run | notification | request_log."
      en-GB: "audit_log | error_event | security_event | job_run | notification | request_log."
    type: enum
    required: false
  - key: filters.severity
    label_key: retention.filters.severity
    description:
      tr-TR: "info | warning | error | critical."
      en-GB: "info | warning | error | critical."
    type: enum
    required: false
  - key: policies.retentionDays
    label_key: retention.policy.retentionDays
    description:
      tr-TR: "Saklama süresi (gün). 1-3650 arası."
      en-GB: "Retention period in days. 1-3650."
    type: number
    required: true
  - key: policies.archiveAfterDays
    label_key: retention.policy.archiveAfterDays
    description:
      tr-TR: "Retention'ın kaç gün öncesinden itibaren cold storage'a taşınsın. 0 = arşiv yok."
      en-GB: "How many days before retention to move to cold storage. 0 = no archive."
    type: number
    required: true
  - key: policies.archiveStorage
    label_key: retention.policy.archiveStorage
    description:
      tr-TR: "hot (canlı DB) | cold (object storage) | none (sadece sil)."
      en-GB: "hot (live DB) | cold (object storage) | none (delete only)."
    type: enum
    required: true
  - key: policies.redactPii
    label_key: retention.policy.redactPii
    description:
      tr-TR: "true (her zaman — KVKK/UK GDPR uyumu; caller override edemez)."
      en-GB: "true (always — KVKK/UK GDPR compliance; caller cannot override)."
    type: boolean
    required: true
  - key: sweeps.dryRun
    label_key: retention.sweep.dryRun
    description:
      tr-TR: "true → gerçek işlem yok, yalnız sayım."
      en-GB: "true → no actual operation, only counting."
    type: boolean
    required: false
actions:
  - key: upsert_policy
    description:
      tr-TR: "Yeni policy oluşturur veya mevcudu günceller."
      en-GB: "Create new policy or update existing."
    permission: "audit:log:read"
  - key: delete_policy
    description:
      tr-TR: "Policy'yi siler; effective policy etkisi hemen uygulanır."
      en-GB: "Delete policy; effective policy changes immediately."
    permission: "audit:log:read"
  - key: view_effective
    description:
      tr-TR: "Tenant + logType + severity için effective policy önizleme."
      en-GB: "Effective policy preview for tenant + logType + severity."
    permission: "audit:log:read"
  - key: trigger_sweep
    description:
      tr-TR: "Manuel retention sweep tetikler; dryRun modunda yalnız sayım."
      en-GB: "Trigger manual retention sweep; dryRun mode counts only."
    permission: "audit:log:read"
  - key: view_sweep_history
    description:
      tr-TR: "Geçmiş sweep kayıtlarını listeler."
      en-GB: "List past sweep records."
    permission: "audit:log:read"
step_by_step:
  tr-TR:
    - "Tarayıcıdan /<locale>/superadmin/retention adresine git."
    - "Üst kısımdaki 'Yeni Policy' / 'Sweep Başlat' butonları ile aksiyon al."
    - "Policies sekmesinde tenant/logType/severity filtresi ile policy listesini incele; satıra tıklayıp detayına geç."
    - "Sweeps sekmesinde from/to filtresi ile sweep geçmişini incele; satıra tıklayıp bucket bazlı expired/archived/deleted sayılarını gör."
    - "Effective sekmesinde tenant/logType/severity seçip 'Hesapla' düğmesine bas; source alanı (tenantOverride | globalOverride | default) ile resolved policy'yi gör."
  en-GB:
    - "Navigate to /<locale>/superadmin/retention in the browser."
    - "Use the top 'New Policy' / 'Start Sweep' buttons to act."
    - "On the Policies tab filter by tenant/logType/severity; click a row to open its detail."
    - "On the Sweeps tab filter by from/to; click a row to view per-bucket expired/archived/deleted counts."
    - "On the Effective tab pick tenant/logType/severity and press 'Resolve'; the source badge (tenantOverride | globalOverride | default) shows the resolved policy."
possible_errors:
  - code: VET-VALIDATION-0001
    tr-TR: "Geçersiz payload (örn. archiveAfterDays > retentionDays)."
    en-GB: "Invalid payload (e.g., archiveAfterDays > retentionDays)."
  - code: VET-AUTHZ-0001
    tr-TR: "SUPERADMIN yetkisi yok."
    en-GB: "Not a SUPERADMIN."
related_pages:
  - web.app.locale.superadmin.retention.[id]
  - web.app.locale.superadmin.retention.sweeps.[id]
related_api:
  - "GET /api/v1/superadmin/log-retention/policies"
  - "GET /api/v1/superadmin/log-retention/policies/effective"
  - "PUT /api/v1/superadmin/log-retention/policies"
  - "DELETE /api/v1/superadmin/log-retention/policies/{id}"
  - "GET /api/v1/superadmin/log-retention/sweeps"
  - "POST /api/v1/superadmin/log-retention/sweeps"
  - "GET /api/v1/superadmin/log-retention/sweeps/{id}"
keywords:
  tr-TR:
    [log retention, arşivleme, retention policy, sweep, KVKK, UK GDPR, PII mask]
  en-GB:
    [log retention, archiving, retention policy, sweep, KVKK, UK GDPR, PII mask]
version: "1.0.0"
last_verified_at: 2026-08-05
