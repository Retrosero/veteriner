# @file VetNiva İzin Kataloğu (YAML).
# @module docs/permissions/PERMISSION_CATALOG
#
# @description Tüm VetNiva permission anahtarlarının yapısal
# tanımı. Format: `<domain>:<resource>:<action>` (ör.
# `clinic:appointment:create`).
#
# Bu dosya makinece okunabilir; insan okunabilir tablo için
# `PERMISSION_MATRIX.md` dosyasına bakın. CI kapısı
# `pnpm docs:check`, kodda kullanılan permission referanslarının
# bu katalogda yer almasını zorunlu kılar.
#
# Notlar:
# - `applies_to_roles`: Bu permission'a sahip olan tüm roller.
#   Portal kullanıcıları `portal:*` permission'larını kullanır
#   ve `tenant_id` yerine `owner_id` kapsamıyla sınırlıdır.
# - `tenant_scope: required` — permission yalnızca aktif oturumun
#   `tenant_id`'si içinde geçerlidir. Cross-tenant erişim denemeleri
#   uygulama katmanında 404 döner.
# - `branch_scope: required` — permission yalnızca aktif oturumun
#   `branch_id`'si içinde geçerlidir. Cross-branch erişim
#   (örn. depo transferi hariç) reddedilir.
# - `self_only: true` — permission yalnızca oturum kullanıcısının
#   kendi kaydına aittir (ör. portal hayvanları).
# - `audit: true` — permission kullanımı audit log'a yansır.
# - `pii: true` — permission PII (Kişisel Tanımlanabilir Bilgi)
#   içeren alanlara erişim sağlar; KVKK gereği loglanır.
# - `amend: true` — düzeltme/amendment işlemi için gereken
#   özel yetki.
# - `system_only: true` — yalnızca sistem (job, vb.) tarafından
#   tetiklenir; manuel çağrılmamalıdır.
#
# @author GOAL-002 (FAZ-0) yetki matrisi
# @since 2026-07-30
# @security Tüm yetkiler tenant-bazlıdır. Cross-tenant erişim
#   denemeleri uygulama katmanında 404 döner ve audit log'a
#   yansır. Süperadmin (SUPERADMIN) tenant dışı görünüm için
#   ayrı context ile çalışır; normal API'lere erişemez.
# =============================================================================
version: "1.0.0"
generated_at: "2026-07-30"
generated_by: "GOAL-002"
notes: >
  Pilot kapsamda üretilen ilk permission kataloğu.
  Sonraki goal'lar (GOAL-012 RBAC, GOAL-014 dosya servisi, vb.)
  ile birlikte genişletilecek.

roles:
  - id: SUPERADMIN
    description: VetNiva platform yönetimi (tenant dışı görünüm).
    access_tenant_data: false
    access_own_tenant_only: false
  - id: OWNER
    description: İşletme sahibi; tenant'ın tüm verisine erişir.
    access_tenant_data: true
    access_own_tenant_only: true
  - id: VETERINARIAN
    description: Veteriner hekim; klinik modüllerinde tam yetki.
    access_tenant_data: true
    access_own_tenant_only: true
  - id: STAFF
    description: Klinik personeli; sınırlı yetki (POS, kabul, hasta sahibi yönetimi).
    access_tenant_data: true
    access_own_tenant_only: true
  - id: PET_OWNER_PORTAL
    description: Hasta sahibi portalı kullanıcısı (yalnızca kendi hayvanları).
    access_tenant_data: true
    access_own_tenant_only: false
    self_only_scope: owner_id

