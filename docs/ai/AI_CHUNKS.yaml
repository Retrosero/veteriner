# -----------------------------------------------------------------------------
# FLOW — Hata Durum Yönetimi (GOAL-103)
# -----------------------------------------------------------------------------
# State machine: new → investigating ↔ resolved ↔ reopened.

- chunk_id: flow-error-status
  type: flow
  source: apps/api/src/modules/error-events/error-events.service.ts
  entity: error_event
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-31
  confidence: high
  pii: false
  title: "Hata Durum Yönetimi (State Machine)"
  content: |
    SUPERADMIN hata merkezi durum yönetimi dört state'ten
    oluşur: `new → investigating`, `investigating ↔ new`,
    `investigating → resolved`, `resolved → reopened`,
    `resolved → investigating`, `reopened → investigating`,
    `reopened → resolved`. Her geçiş append-only
    `errorEventStatusTransition` kaydı oluşturur
    (actorId, actorType, reason, occurredAt). Geçersiz
    geçişler 422 `VET-ERRSTAT-0001` ile reddedilir.
    `resolved` durumdaki bir kayıt için yeni hata
    oluştuğunda (fingerprint tekrarı) otomatik
    `resolved → reopened` terfisi tetiklenir; bu sistem
    kaynaklı bir geçiş olduğu için `actorId='system'`
    ile log'a yazılır. Status değişikliği
    `audit:error_event.status_change` audit olayı
    üretir (info). `assignedToUserId` opsiyonel olarak
    status ile birlikte güncellenebilir; salt atama
    aksiyonu için `PATCH /:id/assignment` (GOAL-104)
    kullanılır.
  keywords: [hata durumu, state machine, status transition,
             resolved, reopened, investigating, new,
             VET-ERRSTAT-0001, audit:error_event.status_change]
