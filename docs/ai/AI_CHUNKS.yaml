    Tenant oluşturma yalnızca SUPERADMIN tarafından yapılır.
    Kapatma (soft delete) fiziksel silme yapmaz; audit log
    korunur. Ülke (TR/GB) oluşturulduktan sonra değiştirilemez
    (ülke adaptörü seçimi bu alana göre yapılır).
