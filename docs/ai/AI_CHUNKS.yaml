  version: "1.0.0"
  last_verified_at: 2026-07-30
  confidence: high
  pii: false
  title: "Kasa ve Gün Sonu Akışı (Cash Register)"
  content: |
    1. Kasa session'ı: açma (`status='open'`) → kapatma
       (`status='closed'`). Tenant başına tek aktif session.
    2. Açma: `cashierId` + `openingBalance` (Decimal, ≥0) +
       `currency`. Aktif session varsa → 409 VET-CASH-0001.
    3. Kapatma: `actualBalance` (gerçek sayım) zorunlu;
       `expectedBalance` otomatik hesaplanır; `difference` =
       `actual - expected`. Negatif fark için `notes`
       zorunlu (VET-CASH-0003).
    4. Yeniden açma (reopen): kapatılmış session düzeltme
       için `status='open'`. Aynı anda açık başka session
       varsa → 409.
    5. Hareketler: `payment` (in) + `payment_reversal` (out)
       + `manual` (in/out). Faz 7 tahsilat (GOAL-072) +
       ters kayıt (GOAL-073) otomatik hareket yaratır.
    6. Özet: `expectedBalance = openingBalance + totalIn -
       totalOut`. `actualBalance` yalnız kapatılmış
       session'larda.
    7. Audit: `audit:cash_register.session.{open,close,
       reopen}` (info/warning). Close'da `expectedBalance` +
       `actualBalance` + `difference` + `notes` payload.
    8. Faz 8'de session raporu export (PDF/CSV).
