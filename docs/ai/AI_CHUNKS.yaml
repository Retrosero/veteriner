    title: Log Retention ve Arşivleme
    content: |
      Log retention, audit_log/error_event/security_event/job_run/
      notification/request_log türündeki log kayıtlarının
      tenant + logType + severity bazında retention süresi +
      arşiv stratejisini tanımlayan policy'dir. Effective
      policy tenantOverride › globalOverride › default
      zinciriyle çözülür. Default retention matrisi: audit_log
      365-1825 gün, error_event 30-365, security_event
      365-2555 (~7 yıl KVKK/UK GDPR), job_run 7-90, notification
      30-180, request_log 7-90. Arşiv storage hot/cold/none;
      archiveAfterDays retention sınırından kaç gün önce
      cold storage'a taşınacağını belirler. `redactPii` alanı
      servis tarafından her zaman true yapılır (caller override
      edemez) — KVKK/UK GDPR uyumu için. Sweep append-only
      history'de expired/archived/deleted sayıları + bucket
      bazlı logType/severity kırılımı saklanır.
    keywords:
