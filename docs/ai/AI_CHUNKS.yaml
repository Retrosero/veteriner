- chunk_id: glossary-rls
  type: glossary
  source: skills/DATABASE_MULTITENANCY.md
  entity: rls
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-30
  confidence: high
  pii: false
  title: "Row Level Security (RLS)"
  content: |
    PostgreSQL Row Level Security. Uygulama her sorgu başında
    `SELECT set_config('app.tenant_id', '<uuid>', true)` ile
    tenant context set eder; RLS policy bu değere göre
    filtreler. SUPERADMIN `app.is_superadmin = 'true` ile
    bypass eder. Aktif tablolar: `branches`,
    `user_tenant_memberships`, `audit_events`. `tenants`
    tablosunda RLS yoktur (SUPERADMIN tüm tenant'ları görür).

    Negative test: actor.tenantId = 'B' iken tenant A'nın
    branch'ini sorgulamak → 0 satır (bilgi sızdırmaz).
  keywords: [RLS, row level security, multi-tenant, postgres, izolasyon]
  related_chunks: [glossary-tenant, glossary-branch, security-cross-tenant]
  related_pages: []
  related_api: []

