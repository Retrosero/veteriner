  title: "Randevu İptal Akışı"
  content: |
    1. Personel randevu detayında "İptal" butonuna tıklar
       (`POST /api/v1/clinic/appointments/{id}/cancel`).
    2. Body: `{"reason": "string"}` (1-200 karakter). Zod şema
       `appointmentCancelInputSchema` enforce eder.
    3. Service `repo.findById(tenantId, id)` ile randevuyu bulur;
       bulunamazsa → 404 `VET-CLINIC-0001` (bilgi sızdırmaz).
    4. Status `cancelled` ise **idempotent**: ikinci kez iptal
       hata vermez, no-op döner.
    5. Status `completed` ise → 422 `VET-APPT-0006` (tamamlanmış
       randevu iptal edilemez).
    6. `repo.update(status: "cancelled")` ile durum güncellenir.
       `CalendarService.releaseSlot` ile booked slot serbest
       bırakılır → aynı saat için yeni randevu oluşturulabilir.
    7. Audit event yazılır: `audit:appointment.cancel` (severity:
       **warning**) — start, end, veterinarianId, previousStatus,
       reason payload. Neden zorunlu olduğu için reason audit'a
       eklenir; bu alan kişisel olabilir ancak audit'te plain
       text tutulur (KVKK kapsamında erişim yetkisi sınırlı).
    8. Durum makinesi: scheduled | confirmed | arrived |
       in_progress → cancelled geçişi serbest; cancelled | completed
       → cancelled YASAK.
