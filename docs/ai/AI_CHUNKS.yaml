  title: "Düşük Stok ve SKT Uyarıları Akışı (Stock Alert)"
  content: |
    1. İki uyarı türü: düşük stok (`lowStock`) ve SKT
       lot (`expiringLots`). Severity seviyeleri ile
       dashboard kartı kaynağı.
    2. Düşük stok severity: `warning` (`qty > 0` ve
       `<= reorderLevel`) | `critical` (`qty <= minStockLevel`
