  last_verified_at: 2026-07-30
  confidence: high
  pii: false
  title: "VET-PORTAL-0001 — Portal davet token'ı geçersiz"
  content: |
    VET-PORTAL-0001, portal davet token'ı geçerli olmadığında
    (bulunamadı, süresi dolmuş veya iptal edilmiş) döndürülen
    hata kodudur. HTTP durum kodu bağlama göre değişir:
    - 404: token repository'de yok.
    - 410: token var ancak `status=expired` veya
      `status=revoked` (kabul anında `pending+expired` ise
      otomatik `expired` işaretlenir).
    - 400: revoke endpoint'inde davet ID bulunamadı.

    Severity: warning. Kaynak: server.

    Kullanıcıya mesaj (tr-TR): "Portal davet bağlantısı
    geçersiz. Lütfen yenileyin." Kullanıcı klinikle iletişime
    geçmeli; yeni davet oluşturulur ve yeni token e-posta ile
    gönderilir (GOAL-025, `POST /api/v1/portal/invitations`).

    Yayınlandığı yer:
    - `PortalService.acceptInvitation` (token yoksa veya
      expired/revoked ise)
    - `PortalService.revoke` (davet ID bulunamadığında)

    İlgili audit: revoke durumunda `audit:portal.invite.revoke`
    (warning); accept'te reddedilen denemeler için audit
    yayınlanmaz (gürültü kontrolü).

    Sık karşılaşılan sebepler:
    - Owner 30 günden eski davet bağlantısını kullanmaya
      çalışmış.
    - Klinik personeli daveti iptal etmiş, owner eski linki
      kullanmaya çalışmış.
    - Token URL'de kopyalanırken bozulmuş (URL encoding
      hatası).
    - Manuel test sırasında aynı token iki kez denenmiş
      (zaten accepted → 409 VET-PORTAL-0002, ayrı kod).
