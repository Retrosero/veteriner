  - chunk_id: error-VET-PORTAL-0001
    type: error
    source: docs/ai/AI_CHUNKS.yaml
    locale: tr-TR
    version: 1.0.0
    last_verified_at: 2026-07-30T00:00:00.000Z
    confidence: high
