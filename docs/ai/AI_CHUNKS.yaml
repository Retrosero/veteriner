- chunk_id: glossary-branch
  type: glossary
  source: docs/domain/DOMAIN_GLOSSARY.md
  entity: branch
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-30
  confidence: high
  pii: false
  title: "Şube (Branch)"
  content: |
    Tenant'ın fiziksel şubesi. Pilot tek şube ile başlar;
    veri modeli çoklu şubeye uygundur. `code` tenant içinde
    benzersizdir. RLS ile `app.tenant_id` set edilir; actor
    kendi tenant'ı dışındaki branch'leri göremez. Soft delete
    (`status=closed`, `archivedAt`) fiziksel silme yapmaz.
  keywords: [şube, branch, multi-branch, RLS, kod]
  related_chunks: [glossary-tenant, audit-branch-create]
  related_pages: []
