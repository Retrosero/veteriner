    title: Satın Alma Siparişi Akışı (Purchase Order)
    content: |
      1. `PurchaseOrder` (PO) yaşam döngüsü: `draft` →
         `approved` → (`partial` | `received`) | `cancelled`.
      2. Oluşturma (POST): `supplierId` zorunlu, `lines[]` (min
         1) zorunlu. Toplam otomatik (Decimal çarpma). Tedarikçi
         arşivliyse 422 VET-PURCHASE_ORDER-0005.
      3. Güncelleme (PATCH): yalnızca `status='draft'`
         güncellenebilir (409 VET-PURCHASE_ORDER-0004). `lines`
         set edilirse replace.
      4. Onay (POST /approve): `draft` → `approved`.
         `approved` olmayan → 409 VET-PURCHASE_ORDER-0002.
      5. Kabul (POST /receive): `approved` → `partial` veya
         `received`. Her satır için `receivedQuantity` (≤
         sipariş miktarı) + `lotId` opsiyonel. Faz 6
         StockMovement (GOAL-063) `type='purchase'` ile bakiye
         atomik artırılır. `lotId` set edilirse SKT/raf takibi
         bağlanır.
      6. İptal (POST /cancel): `draft`/`approved`/`partial` →
         `cancelled`. `received` veya zaten `cancelled` →
         409 VET-PURCHASE_ORDER-0008. Reverse kayıt
         otomatik üretilmez; manuel StockMovement ile düzeltme.
      7. Audit: `audit:purchase_order.{create,update,approve,
         receive,cancel}` (info/warning). Update'te
         before+after; receive'de `newMovementIds[]` payload'a
         eklenir.
