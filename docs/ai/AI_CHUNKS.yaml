    title: Reçete Dağıtımı ve İptali Akışı
    content: |
      Reçete `active` durumdan iki terminal aksiyonla çıkar: `dispense`
      (eczane/stok dağıtımı) ve `cancel` (iptal + sebep). Bir de periyodik
      `expireOverdue` job'ı `active && expiresAt < now` olan reçeteleri
      `expired` yapar. `completed` durumu FAZ-0'da reserve.

      State machine: `active` -> `dispensed` | `cancelled` | `expired` |
      `completed`. Dispense ve cancel yalnızca `active` durumda mümkün;
      aksi → 409 (`VET-PRESC-0003` dağıtım için, `VET-PRESC-0004` iptal
      için).

      Akış adımları:
      1. **Dağıt** (`POST /api/v1/clinic/prescriptions/{id}/dispense`,
         200, yetki `clinic:prescription:dispense`, STAFF): `active`
         reçeteyi `dispensed` yapar; `dispensedAt` + `dispensedBy` set
         edilir. `active` değilse → 409 `VET-PRESC-0003`. Audit
         `audit:prescription.dispense` (info) — id, dispensedBy,
         items snapshot. Stok düşümü (GOAL-066) bu aksiyonla köprü
         kurar.
      2. **İptal** (`POST /api/v1/clinic/prescriptions/{id}/cancel`,
         200, yetki `clinic:prescription:cancel`, VETERINARIAN):
         `active` reçeteyi `cancelled` yapar; `cancelReason` (1-2000,
         zorunlu) kaydedilir. Zaten iptal edilmiş / `expired` /
         `completed` → 409 `VET-PRESC-0004`. Audit
         `audit:prescription.cancel` (warning) — id, cancelReason.
      3. **Süresi dolmuşları expire et** (`expireOverdue()` periyodik
         job, sistem internal): tüm tenant'larda `active && expiresAt
         < now` olan reçeteleri `expired` yapar. Dönüş: güncellenen
         kayıt sayısı. Audit her expire edilen kayıt için
         `audit:prescription.expire` (info). Periyodik job cron'u
         Worker (FAZ-7) tarafından zamanlanır.
      4. **PDF (placeholder)** (`GET
         /api/v1/clinic/prescriptions/{id}/pdf`, 200, yetki
         `clinic:prescription:read`): FAZ-0'da `text/plain` buffer
         döner (id, items, expiresAt, dispensed bilgisi). Gerçek PDF
         render FAZ-10+'da. `Content-Disposition: attachment;
         filename="prescription-<id>.txt"`. Cross-tenant → 404
         `VET-CLINIC-0001`. Audit `audit:prescription.pdf` (info).
      5. **Append-only politika:** Reçete klinik kayıttır; dispense/
         cancel/expire yalnızca state transition + audit; alanlar
         immutable. Yanlış dağıtım sonrası düzeltme `cancel` + yeni
         reçete (iptal `dispensed` durumdan yapılamaz → 409
         `VET-PRESC-0004`).
      6. **Tenant izolasyonu:** Tüm aksiyonlar tenant-scoped;
         cross-tenant denemesi → 404 `VET-CLINIC-0001` veya 403
         `VET-AUTHZ-0001`. `expireOverdue` sistem internal — actor
         yok, tüm tenant'ları tarar.
    keywords:
      - reçete dağıtımı
