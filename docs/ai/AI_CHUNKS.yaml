- chunk_id: kvkk-consent-owner-create
  type: pii-rule
  source: docs/api/api.post._api_v1_clinic_owners.md
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-30
  confidence: high
  pii: true
  title: "KVKK Açık Rızası — Owner Oluşturma"
  content: |
    `POST /api/v1/clinic/owners` çağrısında `consentKvkk=true`
    ZORUNLUDUR. Yanlışlıkla false gönderilirse 422
    `VET-VALIDATION-0002` döner; kayıt oluşturulmaz, audit
    yayınlanmaz.

    Neden zorunlu:
    - KVKK Madde 5/6: Kişisel veri işleme ancak açık rıza ile
      mümkündür. firstName, lastName, phone, email, taxId, address
      PII alanlarıdır.
    - Audit trail: `audit:owner.create` payload'ında
      `consentKvkk` flag'i kayıt altına alınır. Sonradan rıza
      geri çekme talebi `flow-kvkk-erasure` akışı ile işlenir.
    - Pazarlama izni (`consentMarketing`) ayrı bir flag'dir;
      varsayılan false. Rıza olmadan kampanya/ileti gönderilmez.

    Frontend guideline:
    - Owner create formunda iki ayrı onay checkbox'ı gösterilir:
      "KVKK kapsamında kişisel verilerimin işlenmesini kabul
      ediyorum" (zorunlu) + "Kampanya ve bilgilendirme
      iletilerini almak istiyorum" (opsiyonel).
    - Zorunlu onay işaretlenmeden submit butonu devre dışı
      bırakılır.
  keywords: [KVKK, açık rıza, consent, owner, GDPR, pazarlama]
  related_chunks: [glossary-owner, flow-owner-create, flow-kvkk-erasure, pii-phone-mask, pii-tax-id-mask, pii-email-mask, error-VET-VALIDATION-0002]
