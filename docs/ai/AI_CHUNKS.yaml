      release, severity (info|warning|error|critical), fingerprint,
      mask'lı IP, kısa userAgent hash, sanitize edilmiş context
      ve default errorCode taşır. Critical olayda pluggable
      `SecurityAlertAdapter` (default Noop) tetiklenir; `success=true`
      dönerse `alertSent=true` korunur. Aynı fingerprint için
      duplicate event''ler `occurrenceCount` ile takip edilir.
