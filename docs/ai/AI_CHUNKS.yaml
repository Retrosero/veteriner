    title: Log Retention Sweep Akışı
    content: |
      SUPERADMIN `POST /api/v1/superadmin/log-retention/sweeps`
      ile sweep tetikler. Service tüm bilinen tenant'lar ×
      logType × severity kombinasyonları için effective policy
      çözer: tenantOverride varsa onu kullanır; yoksa
      globalOverride; o da yoksa `DEFAULT_RETENTION_DAYS` +
      `DEFAULT_ARCHIVE_AFTER_DAYS` + `DEFAULT_ARCHIVE_STORAGE`
      sabitleri uygulanır. Her bucket için cutoff hesaplanır
      (şimdi - retentionDays); `archive=true` ise target
      repository üzerinden arşive taşınır (cold storage
      adapter varsa) veya silinir. Sonuçlar append-only
      `RetentionSweepResult` kaydında bucket bazlı
      expired/archived/deleted sayıları + totals ile saklanır.
      `dryRun=true` ise gerçek işlem yapılmaz; sadece count
      döner.

      `redactPii` her zaman true (caller override edemez); tüm
      arşivlenecek payload `PiiMasker`'dan geçirilir.

      Permission: `audit:log:read` (SUPERADMIN).
    keywords:
      - sweep
      - retention
      - arşivleme
      - cutoff
      - dryRun
      - cold storage
      - expired
      - archived
      - deleted
      - audit:log_retention.sweep_trigger
