  content: |
    VetNiva dosya servisi (GOAL-014) hasta fotoğrafı, laboratuvar
    raporu, görüntüleme (DICOM), onam formu ve fatura gibi varlıkları
    güvenli şekilde depolar. Upload akışı `POST /api/v1/files` üzerinden
    multipart/form-data olarak alınır; sırasıyla şu kontroller uygulanır:

    1. MIME whitelist (image/jpeg, image/png, application/pdf,
       application/dicom) — dışı MIME → `VET-FILE-0002` (415).
    2. Boyut sınırı (10 MB / dosya) — aşılırsa `VET-FILE-0001` (413).
    3. Antivirus tarama (ClamAV stub) — temiz değilse
       `VET-FILE-0004` (422).
    4. Storage driver seçimi (`STORAGE_DRIVER` env) → `local` veya `s3`.
    5. Audit: `audit:file.upload` (info) + tenant izolasyonu kaydı.

    Tenant bilgisi oturumdan alınır; request body'den güvenilmez.
    Cross-tenant erişim denemeleri 404 (`VET-FILE-0003`) ile sessizce
    reddedilir; bilgi sızdırmazlık için detay verilmez.
