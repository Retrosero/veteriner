    title: Muayene Başlatma ve Tamamlama Akışı
    content: |
      1. **Başlat** (`POST /api/v1/clinic/examinations`, 201, yetki
         `clinic:examination:create`): Zod şema `examinationCreateInputSchema`
         enforce eder: `appointmentId` (non-empty), `type` (consultation
         | follow_up | emergency | routine_check), `chiefComplaint`
         (1-2000 karakter). Body'de `patientId` / `veterinarianId`
         KABUL EDİLMEZ; appointment'tan türetilir.
      2. Service önce `AppointmentsService.findById(tenantId,
         appointmentId, actor)` ile appointment'ın aynı tenant'ta
         olduğunu doğrular. Cross-tenant veya yok → 404
         `VET-CLINIC-0001` (bilgi sızdırmaz).
      3. `PatientsService.findById(tenantId, appt.patientId, actor)` ile
         patient record'unun silinmemiş/arşivsiz olduğunu garanti eder.
         Cross-tenant veya yok → 404 `VET-CLINIC-0001`.
      4. Repository insert: `id = exam-<tenant8>-<uuid8>`, `status =
         "in_progress"`, `startedAt = now`, `completedAt = null`,
         `signedAt = null`, `signedBy = null`. `tenantId` her zaman
         actor.tenantId'den alınır (request body'den güvenilmez).
      5. Audit `audit:examination.create` (info) — appointmentId,
         patientId, veterinarianId, type, status payload.
      6. **Detay** (`GET /api/v1/clinic/examinations/{id}`, 200): tenant-
         scoped; cross-tenant → null (controller 404 `VET-CLINIC-0001`).
      7. **Liste** (`GET /api/v1/clinic/examinations`, 200): filtreler
         `patientId | veterinarianId | status | from | to | limit (1-200,
         default 20) | offset (0-10000, default 0)`. Sıralama
         `startedAt desc`. Yetki `clinic:examination:read`.
      8. **Tamamla** (`POST /api/v1/clinic/examinations/{id}/complete`,
         200): mevcut `status !== "in_progress"` → 409
         `VET-EXAM-0001` (details'te mevcut status). Status
         `completed`, `completedAt = now`. Audit
         `audit:examination.update` (info) — before/after
         status+completedAt. Status makinesi:
         in_progress → completed ✅; completed | amended → completed
         ❌ (409).
