    content: |
      1. Dış cihaz/laboratuvar adaptör sözleşmesi — Faz 7-9
         in-memory. Faz 14'te gerçek HL7/FHIR entegrasyonu.
      2. `LabAdapter` registry: `id` + `name` + `modality`
         (lab/imaging) + `format` (hl7/fhir/astm/
         proprietary) + `endpoint`.
      3. Export: lab order → dış adapter. Async; status
         pending/processing/completed/failed/cancelled.
      4. Import: dış adapter → lab result. Async; rawPayload
         (base64) parse edilir.
      5. Retry: failed → pending; attemptCount++; 3 deneme
         sonrası kalıcı failed.
      6. Tenant-scoped; cross-tenant → 404.
      7. Audit: `audit:lab_adapter_export.{create,retry,
         cancel}` + `audit:lab_adapter_import.create`
         (info/warning).
      8. Faz 14: PACS/DICOM gateway, IDEXX Catalyst,
         Vetlab HL7 bridge vb. adapter'lar.
