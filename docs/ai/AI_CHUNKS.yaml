- chunk_id: notification-channel-overview
  type: page
  source: docs/api/api.post._api_v1_notifications.md
  page_id: api.notifications.send
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-30
  confidence: high
  pii: false
  title: "Bildirim kanallari nasil calisir"
  content: |
    VetNiva bildirim altyapisi (GOAL-015) SMS, e-posta, in-app
    ve (ileride) WhatsApp kanallarini ortak bir soyutlama
    uzerinden yonetir. Su an 4 provider implemente:

    1. `SmtpEmailProvider` -- e-posta (SMTP stub; uretimde
       Nodemailer/Postmark).
    2. `IletimerkeziSmsProvider` -- TR icin SMS saglayici stub'i.
    3. `InAppProvider` + `InboxStore` -- kullanicinin uygulama
       ici inbox'i (`GET /api/v1/notifications/inbox`).
    4. `NoopProvider` -- test/fallback (whatsapp dahil).

    Gonderim akisi: consent check -> template render (tr-TR/en-GB)
    -> queue'ya al -> provider dispatch -> retry (exponential
    backoff, max 3) -> audit kaydi. Ayni `Idempotency-Key` ile
    24 saat icinde tekrar istek gelirse ilk response doner,
    provider yeniden cagrilmaz.

    Tenant bilgisi oturumdan alinir; `channel` ve `userId` request
    body'den gelir ama tenant scope'u actor uzerinden zorlanir.
    Cross-tenant send denemesi `VET-NOTIF-0001` (502) ile
    reddedilir; inbox sorgusu kendi tenant'i disini goremez.

    Hata kodlari: `VET-NOTIF-0001` (502, provider hatasi),
    `VET-NOTIF-0002` (404, sablon bulunamadi), `VET-NOTIF-0003`
    (403, consent reddi).
  keywords: [bildirim, notification, SMS, e-posta, in-app, WhatsApp,
             provider, queue, retry, idempotency, tenant, KVKK]
