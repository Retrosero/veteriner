# üst-düzey "RBAC nasıl çalışır?" sorusuna cevap verir.

- chunk_id: rbac-overview
  type: permission
  source: docs/permissions/PERMISSION_CATALOG.yaml
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-30
  confidence: high
  pii: false
  title: "RBAC genel bakış"
  content: |
    VetNiva RBAC mimarisi dört katmandan oluşur:

    1. Katalog — `docs/permissions/PERMISSION_CATALOG.yaml`
       dosyasında 143 permission `<domain>:<resource>:<action>`
       formatında tanımlıdır. Her satırda resource_type, action,
       tenant_scope, branch_scope, self_only, audit, pii, system_only
       ve applies_to_roles alanları yer alır.
    2. Dekoratörler — Endpoint'ler `@RequirePermission()` (rbac/) veya
       `@RequirePermissions()` (decorators/) ile gereken permission
       anahtarlarını işaretler. `@RequireRoles()` ile rol bazlı
       kısıtlama, `@Public()` ile muafiyet tanımlanır.
    3. Guard'lar — `PermissionsGuard` permission metadata'sını,
       `RolesGuard` ise rol metadata'sını okur. Her ikisi de
       `RbacService`'e karar için danışır.
    4. Servis — `RbacService` katalog yükleyicisinden definition'ları
       alır, SUPERADMIN bypass + tenant + branch + self kontrolünü
       uygular, kararı `PermissionDecision` olarak döner.

    Akış: HTTP isteği → AuthGuard (oturum) → PermissionsGuard /
    RolesGuard → RbacService.evaluate() → grant | deny (VET-AUTHZ-*
    veya audit event).

    Tüm deny kararları `audit:rbac.denied`, grant kararları
    `audit:rbac.granted` event'i ile loglanır. SUPERADMIN bypass
    loglanır (yetki kullanımının kanıtı).
  keywords: [rbac, izin, motor, guard, decorator, service, mimari]
  related_chunks: [rbac-engine, rbac-require-permission,
                   rbac-superadmin, rbac-branch-scope, audit-rbac-denied,
                   audit-rbac-granted]
  related_pages: []
  related_api: []

- chunk_id: permission-clinic-owner-read
  type: permission
  source: docs/permissions/PERMISSION_CATALOG.yaml
  permission: "clinic:owner:read"
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-30
  confidence: high
  pii: true
  title: "clinic:owner:read — Hasta sahibi okuma"
  content: |
    Hasta sahiplerini listeleme ve tekil görüntüleme yetkisi.
    `resource_type: owner`, `action: read`.

    - tenant_scope: required — yalnızca aktif tenant içindeki
      sahipler görüntülenebilir. Cross-tenant deneme
      VET-AUTHZ-0002 ile 404 döner (bilgi sızdırmaz).
    - branch_scope: optional — branch_id filtre olarak kabul
      edilir; kullanıcının kendi branch'ı dışındaki kayıtlar
      VET-AUTHZ-0004 ile 403 döner.
    - self_only: false — başkalarının kayıtları da
      okunabilir (örn. resepsiyon tüm sahipleri görür).
    - audit: false — okuma işlemi audit üretmez (sadece
      yazma/silme audit üretir).
    - pii: true — owner.first_name, owner.last_name, owner.email,
      owner.phone, owner.tax_id PII alanlarıdır; listeleme
      response'unda PII_MASKING kuralları uygulanır.

    Tipik kullanım: `@RequirePermission("clinic:owner:read")`
    (frontend'de `useCan("clinic:owner:read")` ile gizleme).

    Sahip arama ekranı, hayvan kayıt formundaki "sahip seç"
    combobox'ı, hasta sahibi portal davet akışı bu permission'a
    bağlıdır.
  keywords: [permission, owner, read, hasta sahibi, pii, clinic]
  related_chunks: [rbac-overview, rbac-require-permission,
                   glossary-owner, error-VET-AUTHZ-0002,
                   error-VET-AUTHZ-0004, pii-phone-mask]
  related_pages: []
  related_api: [GET /api/v1/clinic/owners, GET /api/v1/clinic/owners/:id]

- chunk_id: branch-scope-info-leak
  type: security
  source: docs/permissions/PERMISSION_CATALOG.yaml
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-30
  confidence: high
  pii: false
  title: "Branch scope'ta bilgi sızdırmazlık kuralı"
  content: |
    Bir permission `branch_scope: required` işaretlendiğinde,
    PermissionsGuard + RbacService birlikte üç aşamalı kontrol
    uygular:

    1. Aktörün aktif branch_id'si var mı? Yoksa VET-AUTHZ-0006
       (tenant bağlamı zorunlu) ile 403.
    2. Hedef kaydın branch_id'si aktörün branch_id'siyle
       eşleşiyor mu? Eşleşmiyorsa VET-AUTHZ-0004 (branches
       arası erişim reddedildi) ile 403.
    3. Aynı hata kodunun tekrar denemelerde varlık/yokluk
       sinyali vermemesi için, "kayıt bulunamadı" durumunda da
       404 döner; 403 ile 404 aynı kod bloğunda maple edilir
       (bilgi sızdırmaz).

    Kurallar:

    - SUPERADMIN bypass uygular (her branch'ı görebilir); bypass
      bile `audit:rbac.granted` loglanır.
    - `branch_scope: optional` ise branch filtresi opsiyoneldir;
      aktör kendi branch'ı dışındaki kayıtları göremez
      (VET-AUTHZ-0004).
    - `self_only: true` ise ek olarak kaydın owner_user_id'si
      aktörle aynı mı kontrol edilir; değilse VET-AUTHZ-0003.
    - Frontend'de branch filtresi UI'da gizlenir; backend hatası
      yetki gizlemenin tek başına güvenli olmadığını vurgular.

    Sızıntı testi: `security-cross-tenant` chunk'ında yer alan
    negatif senaryolar branch senaryolarıyla bire bir aynıdır.
