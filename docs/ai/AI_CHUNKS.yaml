      4. Storage driver seçimi (`STORAGE_DRIVER` env) → `local` veya `s3`.
      5. Audit: `audit:file.upload` (info) + tenant izolasyonu kaydı.

      Tenant bilgisi oturumdan alınır; request body'den güvenilmez.
      Cross-tenant erişim denemeleri 404 (`VET-FILE-0003`) ile sessizce
      reddedilir; bilgi sızdırmazlık için detay verilmez.
