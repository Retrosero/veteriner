- chunk_id: flow-vaccination
  type: flow
  source: packages/contracts/src/vaccination.ts
  entity: vaccination
  locale: tr-TR
  version: "1.1.0"
  last_verified_at: 2026-07-30
  confidence: high
  pii: false
  title: "Aşı Uygulama Akışı (Vaccination Record)"
  content: |
    1. Veteriner, muayene sırasında aşı uygulaması kaydeder
       (randevuya bağlı veya doğrudan).
    2. `POST /api/v1/clinic/vaccinations` ile
       `VaccinationCreateInput` gönderilir: `patientId`,
       `protocolId` (aşı kataloğu — GOAL-050), `vaccineName`,
       `dose`, `lotNumber`, opsiyonel `manufacturer`,
       `administeredAt`, `notes`.
    3. Service, hasta + protokol cross-tenant doğrular;
       `lotNumber` aynı tenant + protokol altında tekil
       olmalı (iptal edilmişler sayılmaz). Duplicate → 409
       `VET-VACC-0003`.
    4. `nextDueAt` protokolün adımlarından otomatik türetilir:
       2+ step → ikinci step farkı; tek step +
       `boosterIntervalDays` → ondan; aksi hâlde null.
    5. Kayıt `status='administered'` ile repo'ya yazılır;
       audit `audit:vaccination.create` (info) yayınlanır.
    6. İptal gerekirse `POST /api/v1/clinic/vaccinations/{id}
       /cancel` ile `status='cancelled'` + `cancelledAt` +
       `cancellationReason` set edilir; kayıt korunur (fiziksel
       silme YOK). Zaten iptal → 409 `VET-VACC-0008`. Audit
       `audit:vaccination.cancel` (warning).
    7. `GET /api/v1/clinic/patients/{id}/vaccinations/next-due`
       ve `/overdue` ile hastanın gelecek/geçmiş aşı takibi
       yapılır.
  keywords: [aşı, akış, vaccination, kayıt, lot, protokol,
             nextDueAt, iptal, append-only, tenant-scoped]
  related_chunks: [glossary-vaccine-protocol, glossary-vaccination, error-VET-VACC-0003, error-VET-VACC-0004, error-VET-VACC-0008]
  related_pages: []
  related_api: []

- chunk_id: flow-vaccine-card
  type: flow
  source: packages/contracts/src/vaccine-card.ts
  entity: vaccine_card
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-30
  confidence: high
  pii: false
  title: "Aşı Kartı Akışı (Vaccine Card)"
  content: |
    1. Aşı kartı, bir hastanın tüm aşı takvimini özetleyen
       derlenmiş görünüm. Personel paneli ve hasta sahibi
       portalı için tek hesaplama kaynağı.
    2. Personel kökü: `GET /api/v1/clinic/vaccines/cards/
       patient/{patientId}` ile kart çekilir. Yetki
       `clinic:vaccination:read`. Cross-tenant patientId → 404
       `VET-CLINIC-0001` (bilgi sızdırmaz).
    3. Uygulanabilir protokoller: türü `Patient.species` ile
       eşleşen veya `species='all'` olan protokol. `species=
       'other'` ise tüm protokoller uygulanabilir (klinik
       politikası: tür bilinmiyor → tüm takvimler).
    4. Her protokol için tüm `Vaccination` kayıtları (iptal
       edilenler dahil) toplanır; `VaccineCardEntry.status`
       çözümlenir: `overdue` (son nextDueAt geçmiş),
       `upcoming` (30 gün içinde), `completed` (tüm step'ler
       bitmiş ve ek doz yok), `not_started` (hiç uygulama yok).
    5. `summary`: her durum için kayıt sayısı. `portalVisible`
       tenant ayarından gelir (default `true`).
    6. Portal kökü: `GET /api/v1/portal/vaccines/cards/patient
       /{patientId}` ile hasta sahibi kendi kartını görür.
       `PortalSessionGuard` ile korunur; tenant session'dan.
       Tenant ayarı `portalVaccineCardEnabled=false` ise 403
       `VET-AUTHZ-0002`.
    7. Tenant ayarı: `GET/PUT /api/v1/clinic/vaccines/cards/
       portal-setting`. PUT ile `portalVaccineCardEnabled`
       güncellenir; audit `audit:vaccine.card.portal_setting.
       update` (info).
    8. Görüntüleme: personel için PDF/çıktı (ileride),
       portal için salt okunur. Aşı kartı verisi
       hesaplanmış (derived) — ana kayıt `Vaccination` +
       `VaccineProtocol`'dür; bu nedenle ayrı bir tablo YOK
       (in-memory derive), DB göçünde materialized view planı.
  keywords: [aşı kartı, vaccine card, takvim, portal,
             tenant ayarı, overdue, upcoming, completed,
             not_started, append-only derive]
