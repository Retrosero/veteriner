    Gerekçe: KVKK, klinik kayıt bütünlüğü ve yasal ibraz
    yükümlülüğü. 90 gün sonra arşivlenen dosyalar retention job
    ile gerçekten silinebilir (ileride, audit ile).

    Audit: `audit:file.archive` (warning) — `metadata: { fileId,
    category, reason? }`. Arşivleme operasyonel risk taşıdığı için
    warning seviyesinde loglanır; upload/download info seviyesindedir.
