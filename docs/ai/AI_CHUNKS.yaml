- chunk_id: flow-patient-create
  type: flow
  source: docs/api/api.post._api_v1_clinic_patients.md
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-30
  confidence: high
  pii: false
  title: "Hayvan (Hasta) Oluşturma Akışı"
  content: |
    1. Personel (STAFF/VETERINARIAN) hasta oluşturma formunu açar
       (`POST /api/v1/clinic/patients`). Gerekli alanlar: `ownerId`,
       `name`, `species`, `gender`, `neutered`. Opsiyonel: `breed`,
       `birthDate`, `microchip`, `color`, `notes`.
    2. Service önce `owners.findById(tenantId, ownerId)` ile sahibin
       aynı tenant'ta olduğunu doğrular. Cross-tenant veya olmayan
       owner → 404 `VET-AUTHZ-0002` (bilgi sızdırmaz).
    3. `species` TR pilot whitelist'inde mi (`dog|cat|bird`)? Aksi →
       422 `VET-CLINIC-0004`. `other` henüz aktif değildir.
    4. `microchip` 15 haneli rakam olmalı (ISO 11784/11785). Format
       bozuksa 422 `VET-VALIDATION-0003`. Aynı tenant'ta aktif bir
       kayıtta bu mikroçip zaten varsa 409 `VET-CLINIC-0003`.
       Farklı tenant aynı mikroçipi kullanabilir (tenant-scoped).
    5. `birthDate` ISO `YYYY-MM-DD`; gelecekte olamaz. Geçersiz veya
       gelecek tarih → 422 `VET-VALIDATION-0009`. Tahmini doğum
       tarihi için aynı alan kullanılır.
    6. Kayıt başarılıysa 201 `Patient` döner; audit
       `audit:patient.create` (info) yazılır (ownerId, name, species,
       breed, birthDate, gender, microchip, neutered payload).
  keywords: [hayvan, hasta, pet, patient, kayıt, mikroçip, microchip, tür, species, whitelist, doğum tarihi, birthDate, owner cross-tenant]
