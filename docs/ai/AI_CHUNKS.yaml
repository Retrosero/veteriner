    title: Aşı Kartı Akışı (Vaccine Card)
    content: |
      1. Aşı kartı, bir hastanın tüm aşı takvimini özetleyen
         derlenmiş görünüm. Personel paneli ve hasta sahibi
         portalı için tek hesaplama kaynağı.
      2. Personel kökü: `GET /api/v1/clinic/vaccines/cards/
         patient/{patientId}` ile kart çekilir. Yetki
         `clinic:vaccination:read`. Cross-tenant patientId → 404
         `VET-CLINIC-0001` (bilgi sızdırmaz).
      3. Uygulanabilir protokoller: türü `Patient.species` ile
         eşleşen veya `species='all'` olan protokol. `species=
         'other'` ise tüm protokoller uygulanabilir (klinik
         politikası: tür bilinmiyor → tüm takvimler).
      4. Her protokol için tüm `Vaccination` kayıtları (iptal
         edilenler dahil) toplanır; `VaccineCardEntry.status`
         çözümlenir: `overdue` (son nextDueAt geçmiş),
         `upcoming` (30 gün içinde), `completed` (tüm step'ler
         bitmiş ve ek doz yok), `not_started` (hiç uygulama yok).
      5. `summary`: her durum için kayıt sayısı. `portalVisible`
         tenant ayarından gelir (default `true`).
      6. Portal kökü: `GET /api/v1/portal/vaccines/cards/patient
         /{patientId}` ile hasta sahibi kendi kartını görür.
         `PortalSessionGuard` ile korunur; tenant session'dan.
         Tenant ayarı `portalVaccineCardEnabled=false` ise 403
         `VET-AUTHZ-0002`.
      7. Tenant ayarı: `GET/PUT /api/v1/clinic/vaccines/cards/
         portal-setting`. PUT ile `portalVaccineCardEnabled`
         güncellenir; audit `audit:vaccine.card.portal_setting.
         update` (info).
      8. Görüntüleme: personel için PDF/çıktı (ileride),
         portal için salt okunur. Aşı kartı verisi
         hesaplanmış (derived) — ana kayıt `Vaccination` +
         `VaccineProtocol`'dür; bu nedenle ayrı bir tablo YOK
         (in-memory derive), DB göçünde materialized view planı.
