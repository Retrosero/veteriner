    title: İlaç Çakışma Kontrolü
    content: |
      İlaç çakışma kontrolü, reçete oluşturma sırasında hastanın bilinen
      alerji (`allergy`) veya kronik durum (`chronic_condition`)
      uyarılarını ilaç adıyla eşleştirir.

      Çalışma şekli (`AlertsService.checkMedicationConflict`):
      - Yalnızca aktif uyarılar değerlendirilir (`archivedAt=null`
        VE `expiresAt>now` veya null).
      - Yalnızca `allergy` ve `chronic_condition` kategorileri
        değerlendirilir; `behavior` ve `medication_conflict` hariç.
      - Case-insensitive substring match: ilaç adı, uyarının
        `title` veya `description` alanında geçiyorsa eşleşme sayılır.
      - Sonuç: eşleşen uyarıların listesi (boş olabilir).

      Kullanım: reçete oluşturma formunda ilaç adı girildiğinde veya
      mevcut reçeteye yeni ilaç eklendiğinde arka planda çağrılır. UI
      eşleşme varsa açık uyarı gösterir; onay mekanizması klinik
      kararına bırakılır (override edilebilir, audit edilmez).

      Sınırlamalar: basit substring match nedeniyle yanlış pozitif
      mümkündür; ör. "Penisilin" eşleşmesi "Penisilinaz" içeren
      kayıtlarda da tetiklenir. Daha gelişmiş eşleşme (ilaç
      sözlüğü/RxNorm) FAZ-3+'da değerlendirilir.
