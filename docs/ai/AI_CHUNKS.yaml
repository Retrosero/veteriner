    title: Aşı Protokolü (Vaccine Protocol)
    content: |
      Aşı protokolü, bir türün (species: dog/cat/bird/all)
      aşı takvimini tanımlayan klinik katalog kaydıdır. Bir
      veya daha fazla step'ten oluşur; her step yaşa
      (`ageWeeks`) göre uygulanacak aşı adını
      (`vaccineName`), sonraki booster'a kadar geçen gün
      sayısını (`boosterIntervalDays`) ve opsiyonel doz
      override'ını taşır. Kategori (WSAVA/AAHA uyumlu):
      `core` (zorunlu), `non_core` (risk-bazlı), `lifestyle`
      (yaşam tarzına göre), `not_recommended` (artık
      önerilmeyen). `isCore` alanı `category='core'` ise
      otomatik `true` yapılır; `totalDurationMonths` son
      step'in `ageWeeks`'inden türetilir — client
      gönderemez. Protokol üzerinde fiziksel silme YOK;
      `archiveProtocol` ile `archivedAt` set edilir (soft
      delete). Arşivli protokol listede dönmez, güncellenemez
      (409 `VET-VACC-0001`). Tenant-scoped; cross-tenant
      IDOR koruması `actor.tenantId` üzerinden.
