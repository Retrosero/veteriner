    title: Klinik Kayıt PDF ve Paylaşım Akışı
    content: |
      Klinik kayıt, bir muayenenin tüm alt kayıtlarının (SOAP + Vitals +
      Diagnoses + Prescriptions + Orders + Followups) birleşik çıktısıdır.
      `ClinicalRecordsService` dört aksiyon sunar:

      1. **PDF render** — `GET /api/v1/clinic/examinations/{id}/pdf`.
         Examination aynı tenant'ta mı (cross-tenant → 404
         `VET-CLINIC-0001`). Alt kayıtlar `Promise.all` ile paralel
         çekilir. FAZ-0'da `text/plain` placeholder buffer döner; gerçek
         PDF (pdfkit/puppeteer + header/footer/logo + imza + watermark)
         FAZ-10+'da. Audit `audit:clinical-record.generate` (info).
      2. **Paylaşım** — `POST /api/v1/clinic/examinations/{id}/share`.
         `channels` en az 1 öğe (boş → 422 `VET-VALIDATION-0010`).
         PDF → `FileService.upload` (FAZ-0 in-memory stub,
         `category: "lab_report"`, `visibility: "portal"`) →
         `NotificationService.send` her kanal için
         (email/sms/in_app, idempotencyKey=`crshare:<pdfId>:<channel>`)
         → 7 gün geçerli share kaydı. Kanal bazında hata olursa diğer
         kanallar devam eder (kısmi başarı, error log). Audit
         `audit:clinical-record.share` (info).
      3. **Paylaşım listesi** — `GET /api/v1/clinic/examinations/{id}/shares`.
         `createdAt` desc; aktif ve iptal edilmiş kayıtlar birlikte
         döner. Cross-tenant → 404. Okuma audit üretmez.
      4. **Paylaşım iptal** — `DELETE /api/v1/clinic/shares/{shareId}`.
         Soft delete (`revokedAt` set). **İdempotent**: zaten iptal
         edilmiş kayıt no-op. Audit `audit:clinical-record.revoke`
         (warning). İlişkili dosya silinmez; `visibility: "portal"`
         kapsamında arşivde kalır.

      Permission: `clinic:examination:read` (render/list),
      `clinic:report:export` (share/revoke). Kanal eşlemesi: email →
      email, sms → sms, portal → in_app. 7 günlük `expiresAt` response
      ile UI'a geri sayım için sunulur; gerçek signed URL FAZ-10+'da.
      Cross-tenant → 404 `VET-CLINIC-0001` (bilgi sızdırmaz); tüm
      aksiyonlar `requireTenantScope` ile tenant-scoped.
