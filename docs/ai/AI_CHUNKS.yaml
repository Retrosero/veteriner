         formatına normalize eder. TR mobil 5XX ile başlamalı; aksi
         → 422 `VET-VALIDATION-0003`.
      4. taxId opsiyonel; girilirse 11 hane → TCKN, 10 hane → VKN
         olarak ülke adaptörü ile algoritmik doğrulanır. Başarısızsa
         422 `VET-VALIDATION-0006`.
      5. Aynı tenant'ta aynı telefon zaten kayıtlıysa
         409 `VET-CLINIC-0002` döner.
      6. Kayıt başarılıysa 201 `Owner` döner; audit
         `audit:owner.create` (info) yazılır (KVKK + telefon payload).
