    title: Aşı Uygulama Kaydı Amendment (Düzeltme) Akışı
    content: |
      1. Hatalı aşı uygulama kayıtları fiziksel silinmez; bunun
         yerine amendment (düzeltme) yapılır. Tıbbi kayıtların
         geçmişi korunur kuralının uygulaması.
      2. `PATCH /api/v1/clinic/vaccines/applications/{id}` ile
         `VaccineApplicationAmendInput` gönderilir: opsiyonel
         `dose`, `nextDueDate`, `notes`, `lot` (lotNumber +
         expiryDate + manufacturer); zorunlu `amendReason` (denetim
         için neden zorunlu).
      3. Service `amendApplication` metodu:
         - Cross-tenant → 404 VET-CLINIC-0001.
         - `existing.status !== 'active'` → 409 VET-VACC-0007
           (iptal edilmiş/düzeltilmiş kayıt amend edilemez).
         - `before` snapshot (dose, nextDueDate, notes, lot)
           audit payload'ı için hazırlanır.
      4. Lot değişimi senaryosu (atomik ters kayıt + yeni düşüm):
         a) Yeni lot SKT kontrolü → geçmişse 422 VET-VACC-0010.
         b) Yeni lot yeterli stok kontrolü → yetersizse 422
            VET-VACC-0009.
         c) Eski lot'a `VaccineStockLedger` reversal kaydı
            (type='reversal').
         d) Yeni lot'a düşüm kaydı (type='usage').
         e) Application kaydının `lot` alanı güncellenir.
         Bu sıralama, yetersiz stok veya SKT geçmiş senaryolarında
         eski lot'u güvenli tutar.
      5. Kayıt güncellenir: `status='amended'`, `amendedAt`,
         `amendedBy`, opsiyonel `amendmentChainId` (parentId) set
         edilir. Eski kayıt korunur (fiziksel silme YOK).
      6. Audit `audit:vaccine.application.amend` (warning) →
         before snapshot + lotChange before/after + newMovementIds
         payload'a eklenir.
      7. Reminder hook: `rescheduleForApplication` amendment
         sonrası tetiklenir; `nextDueAt` değişmişse delta hesabıyla
         `scheduledFor` kaydırılır.
