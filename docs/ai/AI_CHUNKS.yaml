- chunk_id: superadmin-suspicious-activity
  type: audit
  source: apps/api/src/modules/superadmin/superadmin.service.ts
  page_id: api.superadmin.tenants.events
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-30
  confidence: medium
  pii: false
  title: "Supheli aktivite tespiti icin superadmin tenant events"
  content: |
    SUPERADMIN, tenant bazli supheli aktivite kontrolu icin
    `GET /api/v1/superadmin/tenants/{id}/events` endpoint'ini
    kullanir. Son 10 audit event (eventName, actorId, targetType,
    targetId, createdAt) tarih azalan sirada doner.

    Supheli aktivite sinyalleri:

    - Tekrarlayan `audit:auth.login.failure` eventleri: brute-force
      denemesi. 5+ art arda denialarda hesap kilitlenir
      (VET-AUTH-0003, 15 dk).
    - `audit:security.cross_tenant_attempt` eventleri: tenant
      izolasyonu ihlali; FAZ-3+ ile UI'da alarm olarak gosterilir.
    - `audit:rbac.permission_denied` (info) artisi: yetki eskalasyonu
      denemesi; actor bazli alarm kurallari FAZ-3+'da.
    - `lastLoginAt` cok eski (30 gun+) + ani aktivite: ele
      gecirilmis hesap suphesi.
    - `errorCountLast24h > 0` (FAZ-3+'da gercek deger): yogun hata
      artisi (500 spike).

    FAZ-1'de bu endpoint okuma yapar, kendisi audit event
    YAZMAZ (performans). FAZ-3+'da `audit:superadmin.tenant.read`
    (info) eklenecek.

    Cross-tenant denemesi VET-TENANT-0001 (404) ile reddedilir;
    bilgi sizdirmaz.
