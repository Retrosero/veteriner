  title: "Alerji / Kronik Durum Uyarısı Görüntüleme Akışı"
  content: |
    1. Veteriner veya personel, hayvanın klinik kartını açar
       (`GET /api/v1/clinic/patients/{id}`).
    2. UI uyarıları çekmek için
       `GET /api/v1/clinic/patients/{id}/alerts?activeOnly=true` çağrısı
       yapar; `clinic:patient:read` izni gerekir.
    3. Backend `AlertsService.getActiveAlertsForPatient` aktif kayıtları
       döner: `archivedAt=null` VE (`expiresAt=null` VEYA
       `expiresAt>now`); severity ağırlığına göre azalan
       (critical > warning > info).
    4. UI en üstte severity'ye göre sıralı uyarı banner'ları gösterir:
       - `critical`: kırmızı zorunlu dikkat (ör. anafilaksi).
       - `warning`: sarı uyarı (ör. penisilin alerjisi, böbrek
         yetmezliği).
       - `info`: gri bilgi (ör. davranış notu).
    5. Yeni uyarı için personel `POST /api/v1/clinic/patients/{id}/alerts`
       (`clinic:examination:create`) ile ekler. Severity `critical` ise
       audit `audit:alert.create` (info) otomatik yayınlanır.
    6. Süresi dolmuş (`expiresAt<now`) veya arşivlenmiş (`archivedAt`)
       uyarılar UI'da pasif bölümde gösterilir; muayene sırası dikkat
       akışında gizlenir.
