    title: Kontrol Randevusu Oluşturma Akışı
    content: |
      Kontrol randevusu (follow-up), muayene veya reçeteden türetilen
      `type='follow_up'` appointment'tır. Ayrı bir entity değildir;
      normal randevu modeli üzerinden materialize edilir. Böylece
      takvim/uygunluk/hatırlatma akışları tek randevu sözleşmesinden
      geçer.

      Tetikleyici kaynaklar:
      (a) Muayene: `POST /api/v1/clinic/examinations/{id}/followup`.
          Examination aynı tenant'ta mı (cross-tenant → 404
          `VET-CLINIC-0001`). `followUpDate` gelecekte mi
          (geçmiş/invalid → 422 `VET-VALIDATION-0009`).
          `veterinarianId` opsiyonel override; verilmezse
          `examination.veterinarianId`, ikisi de yoksa 422.
      (b) Reçete: `POST /api/v1/clinic/prescriptions/{id}/followup`.
          Prescription aynı tenant'ta mı (cross-tenant → 404).
          `followUpDate` gelecekte mi (422). Hasta ve veteriner
          reçeteden türetilir; override yoktur.

      Her iki akış da `AppointmentsService.create` ile
      `type='follow_up'`, `durationMin=30`,
      `notes='[Kontrol Randevusu] {notes}'` randevu oluşturur.
      Calendar uygunluk kontrolü, idempotency, status yönetimi
      AppointmentsService üzerinden gelir. Slot çakışması
      `VET-APPT-0005` (409) ile sonuçlanır.

      Hasta bazlı bekleyen kontrol listesi:
      `GET /api/v1/clinic/patients/{id}/followups` →
      `status='scheduled'`, `type='follow_up'`, `start > now` filtresi.

      Audit: her başarılı schedule için `audit:followup.create` (info);
      `source: 'examination' | 'prescription'`, ilgili source ID,
      patientId, veterinarianId, start, end, type. `listPending` okuma
      audit üretmez. Tenant kapsamı `requireTenantScope` ile
      enforce edilir; uyuşmazlık → 403 `VET-AUTHZ-0001`.
    keywords:
      - kontrol randevusu
