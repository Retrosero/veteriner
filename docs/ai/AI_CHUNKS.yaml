- chunk_id: flow-examination-sign
  type: flow
  source: apps/api/src/modules/examinations/examinations.service.ts
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-30
  confidence: high
  pii: false
  title: "Muayene İmzalama ve Düzeltme (Amend) Akışı"
  content: |
    1. **İmzala** (`POST /api/v1/clinic/examinations/{id}/sign`, 200,
       yetki `clinic:examination:sign`, VETERINARIAN): mevcut `status
       !== "completed"` → 409 `VET-EXAM-0002`. Zaten imzalanmış
       (`signedAt != null`) → 409 `VET-EXAM-0002` (details'te
       mevcut signedAt).
    2. Status `completed` korunur; `signedAt = now`, `signedBy =
       actor.actorId` set. İmza sonrası **UPDATE/DELETE trigger**
       aktifleşir (FAZ-0 no-op flag; production migration'da DB
       trigger `signed → immutable`). Bu noktada service
       `logger.log({msg: "examination.signed.lock_immutable",
       examinationId, tenantId, signedBy})` logu bırakır.
    3. Audit `audit:examination.sign` (info) — signedAt, signedBy,
       previousStatus payload.
    4. **Düzelt (Amend)** (`POST /api/v1/clinic/examinations/{id}/
       amend`, 200, yetki `clinic:examination:amend`, VETERINARIAN):
       body `ExaminationAmendInput { reason: string (1-2000) }`.
       Zod şema enforce eder. `reason` zorunlu — klinik + hukuki
       denetim için.
    5. Yeni `ExaminationAmend` kaydı oluşturulur
       (`id = exam-amend-<tenant8>-<uuid8>`): `tenantId`,
       `examinationId`, `reason`, `amendedBy = actor.actorId`,
       `amendedAt = now`, **`previousSignedAt` + `previousSignedBy`**
       mevcut examination'dan immutable referans olarak kopyalanır.
    6. Examination `status = "amended"` yapılır; muayene kaydının
       kendisi DEĞİŞTİRİLMEZ (append-only). Yalnızca status + updatedAt
       güncellenir; önceki imza referansı amendment'te saklanır.
    7. Audit `audit:examination.amend` (**warning**) — amendId, reason,
       previousStatus, previousSignedAt, previousSignedBy payload.
       Amend işlemi denetim açısından hassas → warning severity.
    8. Controller response: `{ examination, amend: last }` — amend
       listesi service `listAmends` ile çekilir; son kayıt dönmezse
       500 `VET-CLINIC-0001` (amend kaydı oluşturulamadı).
    9. Status makinesi (imzalama): completed (signedAt=null) → imzala
       ✅; in_progress → imzala ❌ (409); amended → imzala ❌ (409);
       completed (signedAt set) → imzala ❌ (409). Amend zincin
       multi-amend destekler; her biri ayrı append-only kayıt.
    10. **Tenant izolasyonu**: `findById/update` + `amends.insert` +
        `listAmends` tümü `actor.tenantId` kapsamında; cross-tenant
        amendment denemesi → 404 `VET-CLINIC-0001`.
