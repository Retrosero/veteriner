    type: flow
    source: apps/api/src/modules/security-events/security-events.service.ts
    entity: security_event
    locale: tr-TR
    version: 1.0.0
    last_verified_at: 2026-07-31T00:00:00.000Z
    confidence: high
    pii: true
    title: Güvenlik Olayı Kaydı ve Alarm Akışı
    content: |
      Auth guard, RBAC guard, tenant guard ve dış katmanlar
      `recordSecurityEvent(input, actor)` çağrısı yapar; bu
      metot `type + module + normalizeMessage(message)`''dan
      16 hex `fingerprint` üretir. Aynı fingerprint için
      mevcut kayıt varsa `occurrenceCount` artırılır.
      `severity === "critical" && !alertSent` ise
      `SECURITY_ALERT_ADAPTER` token'ı ile DI edilen
      `SecurityAlertAdapter.sendAlert(event)` çağrılır.
      Adapter `success=true` dönerse `repo.markAlertSent`
      ile `alertSent=true` yapılır; `success=false` veya
      throw ise `alertSent=false` korunur.

      Frontend tarafı `recordClientSecurityEvent` üzerinden
      (System namespace, oturum gerekli) aktarım yapar;
      istemciden gelen `tenantId/branchId/userId/actorType/
      requestId` alanlarına GÜVENİLMEZ; bunlar
      `ActorContext`'ten türetilir.

      Permission: `audit:log:read` (SUPERADMIN panel).
      5 type default errorCode map'i: failed_login›
      VET-AUTH-0002, unauthorized_access_attempt›
      VET-AUTHZ-0002, suspicious_export›VET-AUDIT-0002,
      role_change›VET-RBAC-0002, tenant_isolation_breach_attempt›
      VET-TENANT-0002. Default severity: warning | warning |
      error | info | critical.

      IP `192.168.1.***` formatında mask'lı; userAgent 8 hex
      hash. Cross-tenant fingerprint çakışması için caller
      `message` alanına tenant ID'sini dahil etmelidir.
