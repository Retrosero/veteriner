       ile booked/blocked çakışma kontrolü. Çakışma → 409
       `VET-APPT-0005` (`details.reason = booked | blocked`,
       `conflictId` payload).
    6. `end = start + durationMin * 60_000` hesaplanır; repository'ye
       eklenir; `CalendarService.bookSlot` ile booked slot kaydı
       oluşturulur (tenantId/branchId/veterinarianId/appointmentId/
       start/end).
