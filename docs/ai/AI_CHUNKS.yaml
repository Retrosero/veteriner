- chunk_id: flow-client-error-report
  type: flow
  source: apps/web/src/lib/error-reporter.ts
  entity: client_error
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-31
  confidence: high
  pii: true
  title: "Frontend Hata Raporu (Browser → Backend)"
  content: |
    Tarayıcıda oluşan hatalar (Next.js runtime, API
    çağrıları, React render) `error-reporter.ts`
    tarafından yakalanır. Reporter PII mask
    (email/TCKN/telefon/CC) uygular; `maxQueueSize=50`,
    `dedupWindowMs=1000`, `flushIntervalMs=2000`.
    `navigator.sendBeacon` sayfa unload'ında senkron
    flush yapar; navigator yoksa atlanır. Reporter
    hiçbir koşulda throw etmez.

    Batch'lenen raporlar `POST /api/v1/system/error-events`
    endpoint'ine gönderilir. Backend'te
    `recordClientError` istemciden gelen `tenantId`/
    `branchId`/`userId`/`actorType`/`requestId`
    alanlarına GÜVENİLMEZ; bunlar `ActorContext`'ten
    türetilir (impersonation saldırısına karşı).
    `severity` 5xx→error, 4xx→warning şeklinde
    eşlenebilir. `errorCode` opsiyonel; gelmezse
    `VET-CLIENT-0001` atanır. Response'ta
    `id + fingerprint` korelasyon için döner.

    Auth placeholder'ı tüm oturum açmış kullanıcılara
    (personel + portal) açıktır; gerçek auth devreye
    girdiğinde JWT/session doğrulaması
    `ActorContextService` üzerinden otomatik sağlanır.
