    content: |
      Güvenlik olayı, auth/RBAC/tenant guard katmanlarından ve
      frontend'ten gönderilen 5 farklı tipte güvenlik sinyalinin
      merkezi kaydıdır: failed_login, unauthorized_access_attempt,
      suspicious_export, role_change, tenant_isolation_breach_attempt.
