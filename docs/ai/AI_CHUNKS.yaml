    title: Kullanici iletisim izinleri (consent) politikasi
    content: |
      VetNiva bildirim gonderiminde kullanici iletisim izinleri
      zorunludur. `ConsentService` her tenant icin
      `(user, channel, category)` matrisini tutar; izinsiz
      kombinasyonda gonderim `VET-NOTIF-0003` (403, warning) ile
      reddedilir ve `audit:notification.denied` loglanir.

      Varsayilan izin politikasi:

      - `transactional` kategorileri (appointment, vaccination, lab,
        invoice, portal) tenant acilisinda otomatik opt-in sayilir;
        kullanici ayrica kapatabilir.
      - `marketing` kategorisi icin acik opt-in zorunludur;
        varsayilan kapalidir.
      - `system` kategorisi (guvenlik alarmlari, audit uyari'lari)
        consent gerektirmez, her zaman gider.

      KVKK (TR) ve UK GDPR (GB) uyumu icin consent degisimleri
      audit'e kaydedilir; geri cekme (opt-out) anindan itibaren
      30 gun icinde yapilan tum bildirimler `marketing` icin
      retrospektif olarak da maskelenebilir (Faz 11+ delete-by-user
      job).

      Pazarlama mesajlarinda her zaman "abonelligi iptal et"
      linki bulunmalidir (provider adapter'larinin sorumlulugu,
      FAZ-1'de sozlesme seviyesinde).
