# -----------------------------------------------------------------------------
# FLOW — Job Run Lifecycle (GOAL-102)
# -----------------------------------------------------------------------------

- chunk_id: flow-job-run
  type: flow
  source: apps/api/src/modules/job-runs
  entity: job_run
  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-31
  confidence: high
  pii: false
  title: "Job Run Yaşam Döngüsü"
  content: |
    JobRun, BullMQ kuyruğu, adapter, cron veya
    sistem aksiyonu için tek denemeye karşılık
    gelen kayıttır. Lifecycle:
    `pending → running → {succeeded | failed |
    dead_letter}`. `failed` durumda `attempt <
    maxAttempts` ise yeni run `parentRunId` zinciri
    ile başlatılır; `attempt >= maxAttempts` ise
    otomatik `dead_letter`'a terfi edilir.

    SUPERADMIN operatör için 8 endpoint sunar:
    start (`POST /`), finish (`POST /:id/finish`),
    retry (`POST /:id/retry`), list (`GET /`),
    summary (`GET /summary`), dead-letter
    (`GET /dead-letter`), attempts-by-key
    (`GET /attempts/:jobKey`), detail (`GET /:id`).

    PII mask'lı: `input` ve `output` kaydedilirken
    PiiMasker'dan geçirilir; `errorStack` yalnızca
    failed/dead_letter için dolu. `durationMs`
    otomatik hesaplanır. SUPERADMIN yetkisi
    `audit:log:read` ile korunur.
  keywords: [job run, background job, lifecycle, retry,
             dead letter, BullMQ, PII mask, summary,
             audit:job_run.*]
  related_chunks: [glossary-job-run, error-VET-JOBRUN-0001,
                   error-VET-JOBRUN-0003]
  related_pages: [web.superadmin.locale.job-runs]
