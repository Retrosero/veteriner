      2. Priority: `routine` (default) | `urgent` | `stat`.
      3. Collect: numune alımı (`specimenId` + `volumeMl`
         opsiyonel); status `sample_collected`.
      4. Start: cihaz adapter (GOAL-094) ile iş emri
         gönderimi (Faz 14); `deviceId` set edilir.
      5. Complete: sonuçlar (GOAL-092) bu endpoint ile
         veya sonradan girilebilir.
      6. Cancel: `ordered`/`sample_collected`/`in_progress`
         → `cancelled`. Numune alındıysa iptal notu
         zorunlu.
      7. Tenant-scoped; cross-tenant → 404.
      8. Audit: `audit:lab_order.{create,collect,start,
         complete,cancel}` (info/warning).
