    title: Reçete Oluşturma Akışı
    content: |
      Reçete, bir muayeneye (examination) bağlı klinik kayıt entity'sidir.
      Bir reçete en az 1 ilaç/ürün kalemi (`items`) içerir; her kalem
      `drugName`, `dosage`, `frequency` (7 enum + custom), `durationDays`
      (1-365 kalem başı), `route` (oral/topical/injection_im/iv/sc/
      inhalation/other), `instructions` taşır.

      Reçete seviyesinde `durationDays` 1-30 gün ile son kullanma
      (`expiresAt = now + durationDays`) hesaplanır. `items` boş → 422
      `VET-VALIDATION-0010`; `durationDays` 0 veya >30 → 422
      `VET-VALIDATION-0010`. `status='active'` başlatılır; fiziksel silme
      yok (iptal `cancelled` durumu ile).

      Akış adımları:
      1. **Oluştur** (`POST /api/v1/clinic/examinations/{id}/prescriptions`,
         201, yetki `clinic:prescription:create`, STAFF/VETERINARIAN):
         Zod `prescriptionCreateInputSchema` enforce eder. Alanlar:
         `items` (≥1 kalem, zorunlu), `notes` (max 2000, opsiyonel),
         `durationDays` (1-30, zorunlu). Service önce
         `ExaminationsService.findById(tenantId, id, actor)` ile
         muayenenin aynı tenant'ta olduğunu doğrular. Cross-tenant → 404
         `VET-CLINIC-0001` (bilgi sızdırmaz). `expiresAt = now +
         durationDays` gün olarak set edilir. `id =
         prsc-<tenant8>-000001` (artan sayaç, tenant başına). Audit
         `audit:prescription.create` (info) — examinationId, patientId,
         items, status, expiresAt.
      2. **Listele** (`GET /api/v1/clinic/prescriptions`, 200, yetki
         `clinic:prescription:read`): tenant-scoped; opsiyonel filtreler
         `patientId`, `status`, `from`, `to`; pagination `limit`
         (1-200, default 20) + `offset` (0-10000, default 0).
      3. **Detay** (`GET /api/v1/clinic/prescriptions/{id}`, 200,
         yetki `clinic:prescription:read`): tenant-scoped; cross-tenant
         → 404 `VET-CLINIC-0001`.
      4. **State machine:** `active` -> `dispensed` (dispense) |
         `cancelled` (cancel) | `expired` (expireOverdue job) |
         `completed` (ileride, manual). Geçersiz dağıtım → 409
         `VET-PRESC-0003`; geçersiz iptal → 409 `VET-PRESC-0004`.
      5. **Append-only politika:** Reçete klinik kayıttır; mevcut
         kayıt üzerinde UPDATE/DELETE yok (state transition'lar
         append-only audit event'i ile birlikte yapılır). Yanlış
         reçete düzeltmesi `cancel` + yeni reçete ile; önceki kayıt
         korunur.
      6. **Tenant izolasyonu:** `requireTenantScope(actor, tenantId)` +
         `create` (examination varlık kontrolü) tümü `actor.tenantId`
         kapsamında; cross-tenant denemesi → 403 `VET-AUTHZ-0001` veya
         404 `VET-CLINIC-0001`.
      7. **Köprüler:** `medication` order (GOAL-044) reçete ile
         bağlanabilir; `dispense` aksiyonu stok düşümü (GOAL-066)
         tetikler. PDF render FAZ-10+'da; FAZ-0'da text placeholder.
    keywords:
