    1. Personel (STAFF/VETERINARIAN) randevu formunu açar
       (`POST /api/v1/clinic/appointments`).
    2. Zod şema enforce eder: `patientId` (UUID), `veterinarianId`
       (non-empty), `type` (consultation | vaccination | surgery |
       follow_up | lab_visit | grooming), `start` (ISO 8601, gelecekte),
       `durationMin` (1-240), opsiyonel `branchId` / `notes`.
    3. Service önce `patients.findById(tenantId, patientId)` ile
       hastanın aynı tenant'ta olduğunu doğrular. Cross-tenant veya
       olmayan patient → 404 `VET-CLINIC-0001`.
    4. `start` gelecekte olmalı; geçmiş → 422 `VET-VALIDATION-0009`.
       `durationMin <= 0` → 422 `VET-VALIDATION-0009`.
