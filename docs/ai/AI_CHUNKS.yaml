  title: "Superadmin tenant görünümü (listeleme ve detay)"
  content: |
    SUPERADMIN paneli icin tenant listeleme ve detay
    endpoint'leri. Yalnizca SUPERADMIN (audit:log:read
    permission'i + bypass) erisebilir; normal kullanicilar
    VET-AUTHZ-0001 (403) alir.

    Uc endpoint vardir:

    1. `GET /api/v1/superadmin/tenants` — filtreli tenant listesi.
       Query: `page` (default 1), `pageSize` (default 20, max 100),
       `status` (active/suspended/closed), `country` (TR/GB),
       `search` (ad/slug icinde, 1-100 karakter).
       Response: `ListSuperadminTenantsResponse` (items, total,
       page, pageSize).

    2. `GET /api/v1/superadmin/tenants/:id` — tek tenant detayi.
       Response: `TenantDetailResponse` (TenantOverview + son 10
       audit event). Tenant yoksa VET-TENANT-0001 (404) doner
       (bilgi sizdirmaz).

    3. `GET /api/v1/superadmin/tenants/:id/events` — son 10
       audit event'i (tarih azalan).

    Her tenant icin toplanan metrikler: branchCount, userCount,
    enabledModules (FeatureFlagService uzerinden), lastLoginAt
    (en yeni User.lastLoginAt), errorCountLast24h (FAZ-1 stub
    olarak 0, FAZ-3+'da Loki/Prometheus), storageUsedMb
    (FileMeta.sizeBytes BigInt toplami, arsivlenenler haric).

    In-memory aggregation: DB view katmani yok, her tenant icin
    4 paralel sorgu. Pilot olcekte (10-100 tenant) yeterli;
    FAZ-3+'da materialized view + cache gelecek.
