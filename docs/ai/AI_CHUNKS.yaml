  title: "Hata Atama, Çözüm Notu ve Destek Bağlantısı"
  content: |
    SUPERADMIN bir hata olayını geliştirici/sorumluya
    atayabilir (`PATCH /:id/assignment`) veya atamayı
    kaldırabilir (`unassign=true`). Her atama/unassign
    append-only `errorEventAssignment` kaydı oluşturur
    (assigneeId, assignorId, action, assignedAt).
    Status değiştirmez; status yönetimi ayrı bir
    PATCH endpoint'idir.

    Çözüm notları (`POST /:id/notes`) append-only'dur;
    silinemez veya düzeltilemez; düzeltme yeni not
    ile yapılır. `visibility: internal | shared`
    (FAZ-12+'da tenant yöneticileriyle paylaşım için
    rezerve).

    Destek kaydı bağlantıları (`POST /:id/support-links`)
    JIRA/Linear/Zendesk/GitHub gibi dış sistemlerle
    ilişki kurar; en az biri zorunlu (system veya
    externalId veya url veya title).

    Birleşik audit log (`GET /:id/audit-log`) tüm
    aksiyonları (status transition + not + destek
    bağlantısı + atama + occurrence_recorded)
    occurredAt artan sırada döner; UI `action`
    discriminator'ı ile render eder.
