  locale: tr-TR
  version: "1.0.0"
  last_verified_at: 2026-07-31
  confidence: high
  pii: false
  title: "Merkezi Backend Hata Yakalama Akışı"
  content: |
    Backend'de oluşan 5xx hataları ile critical 4xx hataları
    `AllExceptionsFilter` tarafından yakalanır. Filter
    `ErrorEventsService.recordError` çağrısı yapar; bu metot
    `errorCode + module + normalizeMessage(message)`'dan 16
    hex `fingerprint` üretir. Aynı fingerprint için mevcut
    kayıt varsa `occurrenceCount` artırılır, `lastSeenAt`
    güncellenir. `status === 'resolved'` olan kayıt için
    yeni hata oluştuğunda otomatik `resolved → reopened`
    terfisi yapılır. Modül seçimi öncelik sırasıyla:
    `derivedModule` (test override) → `input.module` (filter
    tarafı) → `moduleFromRoute(route)` (path'ten türetme).
    Stack trace yalnızca 5xx + critical için saklanır;
    `context` her zaman PiiMasker'dan geçirilir.

    Frontend (tarayıcı) hataları `error-reporter.ts`
    (apps/web) tarafından batch'lenir ve
    `POST /api/v1/system/error-events` endpoint'ine
    gönderilir. Backend'te `recordClientError` aktör
    bağlamından tenant/branch/userId/actorType türetir;
    istemciden gelen bu alanlara GÜVENİLMEZ
    (impersonation saldırısına karşı).

    Permission: `audit:log:read` (SUPERADMIN panel).
