  content: |
    VetNiva dosya servisinde fiziksel silme YASAKTIR. `DELETE
    /api/v1/files/:id` çağrısı dosyayı "arşivle" durumuna alır
    (soft delete): metadata'da `archivedAt` set edilir, storage'da
