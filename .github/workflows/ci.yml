# GitHub Actions — VetNiva CI
# Bu workflow PR ve main üzerinde çalışır. GOAL-000 kapsamındaki tüm
# kalite kapılarını çalıştırır. Faz 1+ ile birlikte RLS testi, e2e suite
# ve security scan eklenecektir.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Tek doğruluk kaynağı: proje sürümü.
  APP_VERSION: ${{ github.sha }}
  # Tüm job'lar aynı Node sürümünü kullanır.
  NODE_VERSION: "20"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install & cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Upload pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # tools/* paketleri FAZ-11+ backlog — Linux + tsc + ESM uyumsuz (b355a97)
      - run: pnpm turbo run lint --filter=!./tools/*

  type-check:
    name: Type check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # tools/* paketleri FAZ-11+ backlog — Linux + tsc + ESM uyumsuz (b355a97)
      - run: pnpm turbo run type-check --filter=!./tools/*

  unit:
    name: Unit tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vetniva
          POSTGRES_PASSWORD: vetniva
          POSTGRES_DB: vetniva_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vetniva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://vetniva:vetniva@localhost:5432/vetniva_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # tools/* paketleri FAZ-11+ backlog — Linux + tsc + ESM uyumsuz (b355a97)
      - name: Run unit tests
        run: |
          set -o pipefail
          pnpm turbo run test --filter=!./tools/* --force 2>&1 | tee test-output.log
          echo "::notice::Test exit code: $?"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: "**/coverage/**"
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 7

  docs:
    name: Docs & i18n checks
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm i18n:check

  build:
    name: Build
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://vetniva:vetniva@localhost:5432/vetniva_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # tools/* paketleri FAZ-11+ backlog (RAG, security-test, vb.) icin
      # Linux + tsc + ESM ortaminda build hatasi veriyor. Pilot release
      # icin kritik olmadigindan exclude edildi. Detay: GOAL-128 commit
      # b355a97. tools/* pipeline'i FAZ-12+ sprint'inde duzeltilecek.
      - run: pnpm turbo run build --filter=!./tools/*
      - uses: actions/upload-artifact@v4
        with:
          name: api-openapi-${{ github.run_id }}
          path: apps/api/openapi.json
          if-no-files-found: ignore
          retention-days: 7

  e2e-smoke:
    name: E2E smoke
    needs: [unit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vetniva
          POSTGRES_PASSWORD: vetniva
          POSTGRES_DB: vetniva
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vetniva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://vetniva_app:vetniva_app@localhost:5432/vetniva?schema=public
      DATABASE_MIGRATOR_URL: postgresql://vetniva:vetniva@localhost:5432/vetniva?schema=public
      E2E_BASE_URL: http://localhost:3001
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # tools/* paketleri FAZ-11+ backlog (b355a97)
      - run: pnpm turbo run build --filter=!./tools/*
      # Şema uygulanmadan E2E'nin çalışması yanlış-pozitif üretir. Migration
      # hatası doğrudan bu kalite kapısını durdurmalıdır.
      - name: Provision non-superuser runtime database role
        run: |
          PGPASSWORD=vetniva psql \
            --host=localhost \
            --username=vetniva \
            --dbname=vetniva \
            --set=ON_ERROR_STOP=1 \
            --file=tools/docker/postgres-init/02-runtime-roles.sql
      - run: pnpm --filter @vetniva/api db:migrate
      - run: pnpm --filter @vetniva/api db:verify-runtime-role
      - run: pnpm --filter @vetniva/api start &
      - run: pnpm --filter @vetniva/web start &
      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://localhost:3001/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API health endpoint did not become ready within 60 seconds."
          exit 1
      - run: pnpm e2e:smoke
