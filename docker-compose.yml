# Docker Compose — local development stack for VetNiva.
# Tek komut: pnpm docker:up
# Not: app'ler (api/web/worker) local Node ile çalıştırılır; container'lar
# yalnızca veritabanı, kuyruk ve mail servislerini sağlar. Production
# container imajları Faz 12'de hazırlanır.

name: vetniva

services:
  postgres:
    image: postgres:15-alpine
    container_name: vetniva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vetniva
      POSTGRES_PASSWORD: vetniva
      POSTGRES_DB: vetniva
    ports:
      - "5432:5432"
    volumes:
      - vetniva-postgres-data:/var/lib/postgresql/data
      - ./tools/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetniva -d vetniva"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-shadow:
    image: postgres:15-alpine
    container_name: vetniva-postgres-shadow
    restart: unless-stopped
    environment:
      POSTGRES_USER: vetniva
      POSTGRES_PASSWORD: vetniva
      POSTGRES_DB: vetniva_shadow
    ports:
      - "5433:5432"
    volumes:
      - vetniva-postgres-shadow-data:/var/lib/postgresql/data
    profiles: ["shadow"]

  redis:
    image: redis:7-alpine
    container_name: vetniva-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "6379:6379"
    volumes:
      - vetniva-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: vetniva-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vetniva-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT_API: 3001
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: postgresql://vetniva_app:vetniva_app@postgres:5432/vetniva?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-no-reply@vetniva.local}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_ACCESS_TTL: ${AUTH_JWT_ACCESS_TTL:-900}
      AUTH_JWT_REFRESH_TTL: ${AUTH_JWT_REFRESH_TTL:-2592000}
      # Canli ortamda kalici dosya deposu ve malware taramasi zorunludur.
      # Yerel gelistirme icin uygulamalar host'ta calistirilir; bu container
      # profili production davranisini gercekci olarak dogrular.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      # Yerel demo ortamında izin verilen güvenli geliştirme override'ları.
      STORAGE_ALLOW_LOCAL: ${STORAGE_ALLOW_LOCAL:-false}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      SCAN_DRIVER: ${SCAN_DRIVER:-clamav}
      SCAN_ALLOW_NOOP: ${SCAN_ALLOW_NOOP:-false}
      CLAMAV_SOCKET: ${CLAMAV_SOCKET}
      CLAMAV_HOST: ${CLAMAV_HOST}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vetniva-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      APP_VERSION: ${APP_VERSION:-0.1.0}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: vetniva-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: postgresql://vetniva_app:vetniva_app@postgres:5432/vetniva?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-no-reply@vetniva.local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  vetniva-postgres-data:
  vetniva-postgres-shadow-data:
  vetniva-redis-data:
